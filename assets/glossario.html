<script>
// Siglas explicadas ao passar o cursor (ou tocar, no celular). Aplica-se a parágrafos, listas e legendas.
(function () {
  var G = {
    "AF": "Agricultura familiar, conforme a Lei 11.326/2006 e o Censo Agropecuário 2017",
    "PA": "Projeto de Assentamento da reforma agrária",
    "PAs": "Projetos de Assentamento da reforma agrária",
    "INCRA": "Instituto Nacional de Colonização e Reforma Agrária",
    "SIPRA": "Sistema de Informações de Projetos de Reforma Agrária (INCRA)",
    "PNCF": "Programa Nacional de Crédito Fundiário (aquisição de terra mediante financiamento)",
    "PRONAF": "Programa Nacional de Fortalecimento da Agricultura Familiar",
    "DAP": "Declaração de Aptidão ao Pronaf",
    "SEEG": "Sistema de Estimativas de Emissões e Remoções de Gases de Efeito Estufa (Observatório do Clima)",
    "PRODES": "Sistema de monitoramento do desmatamento por satélite do INPE",
    "INPE": "Instituto Nacional de Pesquisas Espaciais",
    "GEE": "Gases de efeito estufa",
    "CO2e": "Dióxido de carbono equivalente, isto é, soma dos gases de efeito estufa ponderada pelo respectivo potencial de aquecimento",
    "GWP-AR5": "Potencial de aquecimento global do 5º Relatório de Avaliação do IPCC, utilizado pelo SEEG para agregar os gases",
    "SAF": "Sistema agroflorestal",
    "PSA": "Pagamento por serviços ambientais",
    "ESG": "Critérios ambientais, sociais e de governança (do inglês environmental, social and governance)",
    "REDD+": "Redução de emissões provenientes do desmatamento e da degradação florestal",
    "VPL": "Valor presente líquido",
    "TIR": "Taxa interna de retorno",
    "PAF": "Análise fatorial por eixos principais (do inglês principal axis factoring), método de extração da análise fatorial exploratória",
    "OE": "Objetivo específico do projeto",
    "iCS": "Instituto Clima e Sociedade",
    "UNEMAT": "Universidade do Estado de Mato Grosso",
    "MapBiomas": "Mapeamento anual da cobertura e do uso da terra no Brasil",
    "CAR": "Cadastro Ambiental Rural",
    "KMO": "Medida de Kaiser-Meyer-Olkin, que avalia a adequação dos dados à análise fatorial e varia de 0 a 1 (valores acima de 0,8 indicam boa adequação)",
    "ARI": "Índice de Rand ajustado, que mede a concordância entre duas classificações dos mesmos municípios (1 = classificações iguais; 0 = concordância atribuível ao acaso)",
    "Jaccard": "Coeficiente de estabilidade de um grupo nas reamostras, igual a 1 quando o grupo se repete sempre de forma idêntica",
    "clusterboot": "Rotina do R (pacote fpc) que avalia a estabilidade dos grupos por reamostragem",
    "silhueta": "Medida de separação dos grupos, que varia de −1 a 1; quanto maior o valor, mais nítidos os grupos",
    "Calinski-Harabasz": "Índice de qualidade do agrupamento; quanto maior o valor, maior a separação entre os grupos",
    "Davies-Bouldin": "Índice de qualidade do agrupamento; quanto menor o valor, maior a separação entre os grupos",
    "gap": "Critério que compara o agrupamento obtido com o de dados gerados ao acaso, com vistas à escolha do número de grupos",
    "Kruskal-Wallis": "Teste de diferença entre grupos baseado na ordem dos valores, e não nos valores em si",
    "ε²": "Tamanho de efeito do teste de Kruskal-Wallis, que expressa a parcela da variação explicada pelo grupo, de 0 a 1",
    "Spearman": "Coeficiente de correlação baseado na ordem dos valores, que varia de −1 a 1",
    "Pearson": "Coeficiente de correlação linear entre os valores, que varia de −1 a 1",
    "Dutilleul": "Correção do teste de correlação que considera a semelhança entre municípios vizinhos",
    "symlog": "Escala logarítmica que admite o valor zero",
    "Φ": "Correlação entre dois fatores em uma rotação oblíqua",
    "AFOLU": "Agricultura, florestas e outros usos da terra (do inglês agriculture, forestry and other land use), setor do inventário de emissões",
    "banking": "Acúmulo de permissões de emissão de um período para utilização posterior",
    "spillover": "Efeito de transbordamento, pelo qual o que ocorre em um mercado afeta outro",
    "cointegração": "Relação de longo prazo entre séries de preços"
  };
  var chaves = Object.keys(G).sort(function (a, b) { return b.length - a.length; });
  var re = new RegExp("(^|[^\\wÀ-ú-])(" + chaves.map(function (k) { return k.replace(/[-+.]/g, "\\$&"); }).join("|") + ")(?![\\wÀ-ú-])");
  function marcar(el) {
    var usados = {};
    var w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        var p = n.parentNode;
        while (p && p !== el) { if (/^(A|ABBR|CODE|SCRIPT|STYLE|SVG|BUTTON|SELECT|OPTION)$/i.test(p.nodeName)) return NodeFilter.FILTER_REJECT; p = p.parentNode; }
        return re.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP;
      }
    });
    var nos = []; while (w.nextNode()) nos.push(w.currentNode);
    nos.forEach(function (n) {
      var m = n.nodeValue.match(re); if (!m || usados[m[2]]) return;
      usados[m[2]] = true;
      var i = m.index + m[1].length, depois = n.splitText(i); depois.splitText(m[2].length);
      var ab = document.createElement("abbr"); ab.title = G[m[2]]; ab.tabIndex = 0; ab.textContent = m[2];
      depois.parentNode.replaceChild(ab, depois);
    });
  }
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll("main p, main li, main figcaption, main .kpi-rotulo, main .kpi-meta").forEach(marcar);
  });
})();
</script>
<div id="dica-grafico" role="tooltip" aria-hidden="true"></div>
<script>
// Dica imediata para elementos com data-tip (pontos, barras e linhas dos gráficos SVG; selos).
(function () {
  var dica = document.getElementById("dica-grafico");
  function mostrar(el, x, y) {
    dica.textContent = el.getAttribute("data-tip");
    dica.style.display = "block";
    var w = dica.offsetWidth, h = dica.offsetHeight;
    var left = Math.min(x + 12, window.innerWidth - w - 8), top = y - h - 12;
    if (top < 4) top = y + 16;
    dica.style.left = left + "px"; dica.style.top = top + "px";
  }
  function esconder() { dica.style.display = "none"; }
  document.addEventListener("mouseover", function (e) {
    var el = e.target.closest && e.target.closest("[data-tip]"); if (el) mostrar(el, e.clientX, e.clientY);
  });
  document.addEventListener("mousemove", function (e) {
    var el = e.target.closest && e.target.closest("[data-tip]"); if (el && dica.style.display === "block") mostrar(el, e.clientX, e.clientY);
  });
  document.addEventListener("mouseout", function (e) {
    if (e.target.closest && e.target.closest("[data-tip]")) esconder();
  });
  document.addEventListener("touchstart", function (e) {
    var el = e.target.closest && e.target.closest("[data-tip]"); var t = e.touches[0];
    if (el) mostrar(el, t.clientX, t.clientY); else esconder();
  }, { passive: true });
  window.addEventListener("scroll", esconder, { passive: true });
})();
</script>
